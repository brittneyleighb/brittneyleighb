<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">Original cascading ASCII character rain</title><desc id="desc">Green text characters cascade downward in vertical streams on a black screen.</desc><defs><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><g id="s" font-family="ui-monospace,monospace" font-size="16" text-anchor="middle"><text y="0" fill="#d8ffe5">0</text><text y="20" fill="#8cffaf">/</text><text y="40" fill="#4fff82">1</text><text y="60" fill="#2cce62">:</text><text y="80" fill="#169a42">+</text><text y="100" fill="#0b5c29">.</text></g></defs><clipPath id="c"><rect width="960" height="210" rx="8"/></clipPath><rect width="960" height="210" rx="8" fill="#020b05"/><g clip-path="url(#c)" filter="url(#g)"><g><use href="#s"/><animateTransform attributeName="transform" type="translate" values="65,-120;65,240" dur="2.5s" repeatCount="indefinite"/></g><g opacity=".75"><use href="#s"/><animateTransform attributeName="transform" type="translate" values="150,-10;150,245" dur="3.4s" repeatCount="indefinite"/></g><g opacity=".65"><use href="#s"/><animateTransform attributeName="transform" type="translate" values="235,-180;235,245" dur="2.1s" repeatCount="indefinite"/></g><g opacity=".9"><use href="#s"/><animateTransform attributeName="transform" type="translate" values="320,-76;320,245" dur="3s" repeatCount="indefinite"/></g><g opacity=".55"><use href="#s"/><animateTransform attributeName="transform" type="translate" values="405,-145;405,245" dur="3.8s" repeatCount="indefinite"/></g><g opacity=".82"><use href="#s"/><animateTransform attributeName="transform" type="translate" values="490,-34;490,245" dur="2.7s" repeatCount="indefinite"/></g><g opacity=".62"><use href="#s"/><animateTransform attributeName="transform" type="translate" valu