<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Retro terminal profile overview</title>
  <desc id="desc">An animated green phosphor terminal displaying current technical focus and projects.</desc>
  <defs>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#011108" opacity=".4"/></pattern>
    <radialGradient id="screen"><stop stop-color="#082b16"/><stop offset=".68" stop-color="#02130a"/><stop offset="1" stop-color="#000603"/></radialGradient>
  </defs>
  <rect width="1200" height="430" rx="10" fill="url(#screen)"/>
  <rect x="16" y="16" width="1168" height="398" rx="5" fill="none" stroke="#2cff81" stroke-opacity=".52"/>
  <g fill="#69ff9f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" filter="url(#glow)">
    <text x="52" y="68" font-size="17" opacity=".72">BIT FOUNDRY LABS // ENGINEERING PROFILE</text>
    <text x="52" y="110" font-size="25">&gt; profile --focus systems-software</text>
    <text x="52" y="151" font-size="18" opacity=".92">[FOCUS] operating systems     [FOCUS] distributed systems</text>
    <text x="52" y="180" font-size="18" opacity=".92">[FOCUS] developer tools       [FOCUS] interaction design</text>
    <text x="52" y="229" font-size="29" letter-spacing="1">CURRENT WORK</text>
    <text x="52" y="263" font-size="17" opacity=".82">MSCS · Rust · Java · Flutter</text>
    <text x="52" y="315" font-size="19">&gt; Embers Kernel · Emberglass OS · Forge Loop</text>
    <rect x="810" y="296" width="13" height="23" fill="#69ff9f"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/></rect>
  </g>
  <rect width="1200" height="430" rx="10" fill="url(#scanlines)" opacity=".46"/>
  <rect x="0" y="0" width="1200" height="430" rx="10" fill="#41ff87" opacity=".07"><animate attributeName="opacity" values=".04;.10;.05;.08;.04" dur="3.6s" repeatCount="indefinite"/></rect>
</svg>