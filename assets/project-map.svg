<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">A map of Brittney's projects, from systems to interface experiments</title>
<desc id="desc">Three connected domains: Systems with Raft KV Store and Neural Trace; Developer tools with ForgeLoop; Interfaces and experiments with Café Nebula and Ándale.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e10"/><stop offset="1" stop-color="#10231b"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#457965"/><stop offset=".45" stop-color="#adffbb"/><stop offset="1" stop-color="#528a77"/></linearGradient>
  <pattern id="dotgrid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#9cebbb" opacity=".24"/></pattern>
  <filter id="shine"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<style><![CDATA[
.pulse{animation:pulse 5.5s ease-in-out infinite;transform-origin:center}
.scan{animation:scan 10s linear infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes scan{from{transform:translateX(-1040px)}to{transform:translateX(1060px)}}
@media(prefers-reduced-motion:reduce){.scan,.pulse{animation:none}}
]]></style>
<rect width="1200" height="360" rx="9" fill="url(#bg)"/>
<rect width="1200" height="360" rx="9" fill="url(#dotgrid)"/>
<rect x="1" y="1" width="1198" height="358" rx="9" fill="none" stroke="#547768" opacity=".55"/>
<g font-family="Consolas,Menlo,Monaco,monospace">
<text x="46" y="46" fill="#baf1c9" letter-spacing="3" font-size="14" font-weight="bold">PROJECT TOPOLOGY</text>
<text x="1150" y="45" fill="#82a994" font-size="12" text-anchor="end" letter-spacing="2">NOT A DEPENDENCY GRAPH / 2026</text>
<path d="M52 66H1149" stroke="#668f7c" opacity=".3"/>
<g stroke="url(#beam)" fill="none">
 <path d="M214 132H985" stroke-width="2" opacity=".60"/>
 <path d="M214 132V186" stroke-width="1.5" opacity=".68"/>
 <path d="M599 132V186" stroke-width="1.5" opacity=".68"/>
 <path d="M985 132V186" stroke-width="1.5" opacity=".68"/>
</g>
<path d="M214 132H985" stroke="#8cffaa" stroke-width="7" filter="url(#shine)" opacity=".22"/>
<g class="scan"><circle cx="214" cy="132" r="5" fill="#d6ffcb"/><circle cx="214" cy="132" r="11" fill="#adffbd" opacity=".14"/></g>
<g>
