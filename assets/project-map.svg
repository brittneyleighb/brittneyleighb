<title id="title">A map of Brittney's projects, from systems to interface experiments</title>
<desc id="desc">Three connected domains: Systems with Raft KV Store and Neural Trace; Developer tools with ForgeLoop; Interfaces and experiments with Café Nebula and Ándale.</desc>
