 <circle cx="599" cy="132" r="9" fill="#101d18" stroke="#a7eeb4" stroke-width="2"/>
 <circle cx="985" cy="132" r="9" fill="#101d18" stroke="#a7eeb4" stroke-width="2"/>
 <circle class="pulse" cx="214" cy="132" r="18" stroke="#7cf4a3" stroke-width="1" fill="none" opacity=".4"/>
 <circle class="pulse" cx="599" cy="132" r="18" stroke="#7cf4a3" stroke-width="1" fill="none" opacity=".4"/>
 <circle class="pulse" cx="985" cy="132" r="18" stroke="#7cf4a3" stroke-width="1" fill="none" opacity=".4"/>
</g>
<g font-size="12" letter-spacing="2.8" fill="#a7e6ba" text-anchor="middle">
