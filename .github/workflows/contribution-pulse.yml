name: Update unified profile graphic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/profile-composite.svg'
      - 'scripts/build_profile.py'
      - 'scripts/test_unified_profile.py'
      - '.github/workflows/contribution-pulse.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_profile.py'
      - 'scripts/update_pulse.py'
      - '.github/workflows/contribution-pulse.yml'
  schedule:
    - cron: '37 11 * * *'

permissions:
  contents: write

concurrency:
  group: unified-profile-graphic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: python -m pip install --disable-pip-version-check 'CairoSVG>=2.7,<3' 'Pillow>=10,<13'
      - name: Validate chart and SVG logic
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Update activity and render animated composite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: brittneyleighb
        run: python scripts/build_profile.py
      - name: Upload review preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: unified-profile-preview
          path: |
            assets/profile-composite.svg
            assets/profile-composite.gif
      - name: Commit updated artwork
        if: github.event_name != 'pull_request'
        run: |
          git add assets/profile-composite.svg assets/profile-composite.gif README.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh unified profile artwork'
            git push
          fi
